# Throwaway MySQL used only to read the WordPress export.
# Not part of the app runtime. Data is disposable: 00-load-dump.sh recreates it.
name: designaustria-wp-migration

services:
  wp-mysql:
    image: mysql:8.4
    container_name: designaustria-wp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: wp
      MYSQL_DATABASE: wordpress
    ports:
      - '127.0.0.1:3307:3306'
    command:
      - --max_allowed_packet=512M
      - --sql_mode=NO_AUTO_VALUE_ON_ZERO
    volumes:
      - wp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-pwp']
      interval: 2s
      timeout: 5s
      retries: 60

  # Local Payload database to develop the schema and the import against.
  # Use: DATABASE_URL=postgres://payload:payload@127.0.0.1:5433/payload
  payload-db:
    image: postgres:17
    container_name: designaustria-payload-db
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - payload-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'payload']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  wp-mysql-data:
  payload-db-data:
